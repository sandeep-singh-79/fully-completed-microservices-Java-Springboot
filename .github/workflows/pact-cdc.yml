name: Pact CDC CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pact-cdc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Docker using Docker's official script
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
        continue-on-error: false

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.3.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version
        continue-on-error: false

      - name: Start Pact Broker and WireMock with Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d pact-broker wiremock

      - name: Wait for Pact Broker to be ready
        run: |
          for i in {1..30}; do
            if curl -u admin:admin -f http://localhost:9292/diagnostic/status/heartbeat; then
              echo "Pact Broker heartbeat is healthy!"; exit 0;
            elif curl -u admin:admin -f http://localhost:9292; then
              echo "Pact Broker root is up!"; exit 0;
            fi;
            echo "Waiting for Pact Broker health..."; sleep 3;
          done
          echo "Pact Broker did not become healthy in time"; exit 1

      - name: Wait for WireMock to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/__admin/health; then
              echo "WireMock health endpoint is healthy!"; break;
            elif curl -f http://localhost:8080/__admin/mappings; then
              echo "WireMock mappings endpoint is up!"; break;
            fi;
            echo "Waiting for WireMock..."; sleep 3;
          done

      - name: Run Order Service Contract Tests
        run: |
          cd services/order
          mvn clean test -Dtest=ProductServiceContractTest

      - name: Run Payment Service Contract Tests
        run: |
          cd services/payment
          mvn clean test -Dtest=OrderServiceContractTest

      - name: Ensure Pact Files Were Generated
        run: |
          echo "Checking Pact files..."
          if [ -z "$(ls -A pacts/*.json 2>/dev/null)" ]; then
            echo "::error::No Pact files found in the 'pacts' directory."
            exit 1
          fi

      - name: Publish Pacts to Pact Broker (Docker)
        run: |
          docker run --rm --network=host -v ${{ github.workspace }}/pacts:/pacts pactfoundation/pact-cli:latest publish /pacts --broker-base-url http://localhost:9292 --broker-username admin --broker-password admin --consumer-app-version "${{ github.sha }}-${{ github.run_number }}" --tag "${GITHUB_REF##*/}" --tag "dev"

      - name: Validate Pact Broker UI
        run: |
          curl -u admin:admin -f http://localhost:9292 || exit 1

      - name: Validate Order-Service -> Product-Service Pact Presence
        run: |
          curl -u admin:admin -f http://localhost:9292/pacts/provider/product-service/consumer/order-service/latest || exit 1

      - name: Validate Payment-Service -> Order-Service Pact Presence
        run: |
          curl -u admin:admin -f http://localhost:9292/pacts/provider/order-service/consumer/payment-service/latest || exit 1

      # Provider verification for Product Service (as provider for Order Service)
      - name: Provider Verification - Product Service
        run: |
          cd services/product
          mvn test -Dtest=com.alibou.pact.provider.ProductProviderPactVerificationTest -Dpact.verifier.publishResults=true

      # - name: Publish Provider Verification Results - Product Service
      #   if: success()
      #   run: |
      #     docker run --rm --network=host pactfoundation/pact-cli:latest publish-verification-results --broker-base-url http://localhost:9292 --broker-username admin --broker-password admin --provider-app-version "${{ github.sha }}-product" --provider product-service --consumer order-service --success

      # Provider verification for Order Service (as provider for Payment Service)
      - name: Provider Verification - Order Service
        run: |
          cd services/order
          mvn test -Dtest=com.alibou.pact.provider.OrderProviderPactVerificationTest -Dpact.verifier.publishResults=true

      # - name: Publish Provider Verification Results - Order Service
      #   if: success()
      #   run: |
      #     docker run --rm --network=host pactfoundation/pact-cli:latest publish-verification-results --broker-base-url http://localhost:9292 --broker-username admin --broker-password admin --provider-app-version "${{ github.sha }}-order" --provider order-service --consumer payment-service --success

      # Upload Pact files and logs as artifacts for debugging
      - name: Upload Pact Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-files
          path: pacts/*.json

      - name: Upload Provider Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-logs
          path: |
            services/product/target/surefire-reports/*.txt
            services/order/target/surefire-reports/*.txt

      # Wait for Provider Verification Results - Product Service
      # - name: Validate Provider Verification Results - Product Service
      #   run: |
      #     for i in {1..10}; do
      #       VERIF_URL=$(curl -s -u admin:admin http://localhost:9292/pacts/provider/product-service/consumer/order-service/latest | jq -r '._links["pb:latest-verification-result"].href')
      #       if [ "$VERIF_URL" != "null" ] && curl -s -u admin:admin "$VERIF_URL" | jq -e '.success == true' > /dev/null; then
      #         echo "Provider verification results for Product Service successfully published to the Pact Broker."; exit 0;
      #       fi
      #       echo "Waiting for Product Service verification results to appear in Pact Broker..."; sleep 5;
      #     done
      #     echo "Provider verification results for Product Service not found in Pact Broker after waiting."; exit 1

      # Wait for Provider Verification Results - Order Service
      # - name: Validate Provider Verification Results - Order Service
      #   run: |
      #     for i in {1..10}; do
      #       VERIF_URL=$(curl -s -u admin:admin http://localhost:9292/pacts/provider/order-service/consumer/payment-service/latest | jq -r '._links["pb:latest-verification-result"].href')
      #       if [ "$VERIF_URL" != "null" ] && curl -s -u admin:admin "$VERIF_URL" | jq -e '.success == true' > /dev/null; then
      #         echo "Provider verification results for Order Service successfully published to the Pact Broker."; exit 0;
      #       fi
      #       echo "Waiting for Order Service verification results to appear in Pact Broker..."; sleep 5;
      #     done
      #     echo "Provider verification results for Order Service not found in Pact Broker after waiting."; exit 1

      - name: Stop Pact Broker and WireMock containers
        if: always()
        run: |
          docker-compose -f docker-compose.yml down
