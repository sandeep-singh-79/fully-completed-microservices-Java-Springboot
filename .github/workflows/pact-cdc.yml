name: Pact CDC CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pact-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [dev]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
  
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Docker using Docker's official script
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
  
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.3.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Start Pact Broker and WireMock with Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d pact-broker wiremock

      - name: Wait for Pact Broker to be ready
        run: |
          for i in {1..30}; do
            if curl -u admin:admin -f http://localhost:9292/diagnostic/status/heartbeat; then
              echo "Pact Broker heartbeat is healthy!"; exit 0;
            elif curl -u admin:admin -f http://localhost:9292; then
              echo "Pact Broker root is up!"; exit 0;
            fi;
            echo "Waiting for Pact Broker health..."; sleep 3;
          done
          echo "Pact Broker did not become healthy in time"; exit 1

      - name: Wait for WireMock to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/__admin/health; then
              echo "WireMock health endpoint is healthy!"; break;
            elif curl -f http://localhost:8080/__admin/mappings; then
              echo "WireMock mappings endpoint is up!"; break;
            fi;
            echo "Waiting for WireMock..."; sleep 3;
          done

      - name: Run Order Service Contract Tests
        run: |
          cd services/order
          mvn clean test -Dtest=ProductServiceContractTest

      - name: Run Payment Service Contract Tests
        run: |
          cd services/payment
          mvn clean test -Dtest=OrderServiceContractTest
      
      - name: Ensure Pact Files Were Generated
        run: |
          echo "Checking Pact files..."
          if [ -z "$(ls -A pacts/*.json 2>/dev/null)" ]; then
            echo "::error::No Pact files found in the 'pacts' directory."
            exit 1
          fi

      - name: Ensure '${{ matrix.environment }}' Environment Exists in Pact Broker
        run: |
          set -e
          ENV_NAME="${{ matrix.environment }}"
          # Set production flag based on environment name
          if [ "$ENV_NAME" = "prod" ] || [ "$ENV_NAME" = "production" ]; then
            PRODUCTION_FLAG=true
          else
            PRODUCTION_FLAG=false
          fi
          # Use jq for robust environment existence check
          ENV_EXISTS=$(docker run --rm --network=host pactfoundation/pact-cli:latest broker list-environments --broker-base-url http://localhost:9292 --broker-username admin --broker-password admin --output json | jq -r --arg name "$ENV_NAME" '.[] | select(.name == $name) | .name')
          if [ -z "$ENV_EXISTS" ]; then
            echo "Environment '$ENV_NAME' does not exist. Creating..."
            docker run --rm --network=host pactfoundation/pact-cli:latest broker create-environment --broker-base-url http://localhost:9292 --broker-username admin --broker-password admin --name "$ENV_NAME" --display-name "$ENV_NAME" --production $PRODUCTION_FLAG
          else
            echo "Environment '$ENV_NAME' already exists. Skipping creation."
          fi

      - name: Publish Pacts to Pact Broker (Docker)
        run: |
          docker run --rm --network=host -v ${{ github.workspace }}/pacts:/pacts pactfoundation/pact-cli:latest publish /pacts --broker-base-url http://localhost:9292 --broker-username admin --broker-password admin --consumer-app-version "${{ github.sha }}-${{ github.run_number }}" --tag "${GITHUB_REF##*/}" --tag ${{ matrix.environment }}

      - name: Validate Pact Broker UI
        run: |
          curl -u admin:admin -f http://localhost:9292 || exit 1
      - name: Validate Order-Service -> Product-Service Pact Presence
        run: |
          curl -u admin:admin -f http://localhost:9292/pacts/provider/product-service/consumer/order-service/latest || exit 1
  
      - name: Validate Payment-Service -> Order-Service Pact Presence
        run: |
          curl -u admin:admin -f http://localhost:9292/pacts/provider/order-service/consumer/payment-service/latest || exit 1

      - name: Run Pact Provider Verification for Product Service
        id: product_provider_verification
        run: |
          cd services/product
          mvn test -Dtest=com.alibou.pact.provider.ProductProviderPactVerificationTest -Dpact.verifier.publishResults=true -Dpact.provider.tag=${{ matrix.environment }} -Dpact.provider.version=${{ github.sha }}-${{ github.run_number }}
      
      - name: Run Pact Provider Verification for Order Service
        id: order_provider_verification
        run: |
          cd services/order
          mvn test -Dtest=com.alibou.pact.provider.OrderProviderPactVerificationTest -Dpact.verifier.publishResults=true -Dpact.provider.tag=${{ matrix.environment }} -Dpact.provider.version=${{ github.sha }}-${{ github.run_number }}

      - name: Can I Deploy Check for Product Service
        id: can_i_deploy_product
        if: ${{ steps.product_provider_verification.outcome }} == 'success'
        run: |
          docker run --rm --network=host pactfoundation/pact-cli:latest pact-broker can-i-deploy --pacticipant product-service --version "${{ github.sha }}-${{ github.run_number }}" --broker-base-url http://localhost:9292 --broker-username admin --broker-password admin --retry-while-unknown 20 --retry-interval 5 --to-environment ${{ matrix.environment }}

      - name: Can I Deploy Check for Order Service
        id: can_i_deploy_order
        if: ${{ steps.order_provider_verification.outcome }} == 'success'
        run: |
          docker run --rm --network=host pactfoundation/pact-cli:latest pact-broker can-i-deploy --pacticipant order-service --version "${{ github.sha }}-${{ github.run_number }}" --broker-base-url http://localhost:9292 --broker-username admin --broker-password admin --retry-while-unknown 20 --retry-interval 5 --to-environment ${{ matrix.environment }}

      - name: Upload Pact Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-files
          path: pacts/*.json

      - name: Upload Provider Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-logs
          path: |
            services/product/target/surefire-reports/*.txt
            services/order/target/surefire-reports/*.txt
      
      - name: Stop Pact Broker and WireMock containers
        if: always()
        run: |
          docker-compose -f docker-compose.yml down
